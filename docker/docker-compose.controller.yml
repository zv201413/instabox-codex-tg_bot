services:
  instabox-controller:
    build:
      context: ..
      dockerfile: docker/Dockerfile.controller
    restart: unless-stopped
    init: true
    stop_grace_period: 75s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cpus: '0.50'
    mem_limit: 256m
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - controller-data:/data
    env_file:
      - .env.controller
    environment:
      AGENT_API_HOST: '0.0.0.0'
      CONTROLLER_DB_PATH: /data/controller.db
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  controller-data:
